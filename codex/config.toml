model = "gpt-5.6-sol"
model_reasoning_effort = "high"
personality = "pragmatic"
service_tier = "priority"

[features]
hooks = true
js_repl = false

[auto_review]
policy = """
The user explicitly authorizes routine GitHub delivery for Codex-owned work branches in every local session.

Approve an ordinary `git push -u origin <branch>` when all of these conditions hold:
- `<branch>` starts with `agent/issue-` or `codex/`.
- The destination is the repository's configured `origin`.
- The command does not use force, force-with-lease, delete, mirror, all, tags, or a refspec that targets another branch.
- The destination branch is not `main`, `master`, `dev`, or the pull request's base branch.

Approve `gh pr create` when its head branch starts with `agent/issue-` or `codex/` and its base is a different branch.
Treat source-code transmission to the configured Git remote as explicitly authorized only in those cases.
Continue to reject or require the user for direct pushes to base/protected branches, force pushes, branch deletion, merges, releases, deployments, and unrelated external data transmission.
"""

[notice]
hide_gpt5_1_migration_prompt = true
"hide_gpt-5.1-codex-max_migration_prompt" = true

[desktop]
conversationDetailMode = "STEPS_COMMANDS"
ambient-suggestions-enabled = true
followUpQueueMode = "queue"
realtimeVoiceScreenContextEnabled = true
appearanceTheme = "system"

[desktop.open-in-target-preferences]
global = "zed"

# --- MCP servers (직접 추가한 것만) ---

[mcp_servers.agent-device]
command = "agent-device"
args = ["mcp"]

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@latest"]

[mcp_servers.mobbin]
url = "https://api.mobbin.com/mcp"

[mcp_servers.google_cloud_big_query_mcp]
enabled = true
url = "https://bigquery.googleapis.com/mcp"

[mcp_servers.safari-mcp-stp]
command = "/Applications/Safari Technology Preview.app/Contents/MacOS/safaridriver"
args = ["--mcp"]

# --- 마켓플레이스 (직접 추가한 git 소스만) ---

[marketplaces.planetscale]
source_type = "git"
source = "https://github.com/planetscale/codex-plugin.git"

[marketplaces.expo-plugins]
source_type = "git"
source = "https://github.com/expo/skills.git"
ref = "main"

[marketplaces.sentry-plugin-marketplace]
source_type = "git"
source = "https://github.com/getsentry/plugin-codex.git"

[plugins."planetscale@planetscale"]
enabled = true

[plugins."expo@expo-plugins"]
enabled = true

[plugins."sentry@sentry-plugin-marketplace"]
enabled = true
